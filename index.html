<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>PromptFlow</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
:root{--bg:#0f172a;--bg2:#1e293b;--bg3:#0f172a;--card:#1e293b;--border:#334155;--text:#f1f5f9;--text2:#94a3b8;--text3:#64748b;--ind:#818cf8}
@media(prefers-color-scheme:light){:root{--bg:#f8fafc;--bg2:#fff;--bg3:#f1f5f9;--card:#fff;--border:#e2e8f0;--text:#0f172a;--text2:#475569;--text3:#94a3b8}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Plus Jakarta Sans','Noto Sans Thai',sans-serif;background:var(--bg);color:var(--text);display:flex;flex-direction:column}
.hdr{background:linear-gradient(135deg,#1e1b4b,#312e81,#1e3a5f);padding:12px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0}
.logo{width:32px;height:32px;background:linear-gradient(135deg,#818cf8,#38bdf8);border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.brand{font-size:15px;font-weight:700;color:#fff}.brand-sub{font-size:9px;color:#a5b4fc}
.hdr-r{margin-left:auto}.lsw{position:relative}
.lsw select{appearance:none;background:rgba(255,255,255,.12);border:.5px solid rgba(129,140,248,.4);color:#e0e7ff;font-size:11px;font-weight:600;font-family:inherit;padding:5px 20px 5px 8px;border-radius:7px;cursor:pointer;outline:none}
.lsw::after{content:'▾';position:absolute;right:6px;top:50%;transform:translateY(-50%);color:#a5b4fc;font-size:10px;pointer-events:none}
.car-row{padding:8px 12px 9px;background:var(--bg3);flex-shrink:0;border-bottom:1px solid var(--border)}
.car-wrap{position:relative}
.car-wrap select{width:100%;appearance:none;background:var(--bg2);border:.5px solid var(--border);color:var(--text);font-size:13px;font-weight:600;font-family:inherit;padding:9px 30px 9px 12px;border-radius:9px;cursor:pointer;outline:none}
.car-wrap select:focus{border-color:var(--ind)}
.car-wrap::after{content:'▾';position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--text3);pointer-events:none}
.badge{display:inline-flex;align-items:center;gap:4px;margin-top:5px;padding:3px 9px;border-radius:20px;font-size:10px;font-weight:600}
.lvl-row{display:flex;background:var(--bg3);padding:8px 12px 0;gap:8px;flex-shrink:0}
.lvl-btn{flex:1;padding:9px 4px 7px;font-size:10px;font-weight:700;cursor:pointer;border:1.5px solid var(--border);background:var(--bg2);color:var(--text3);font-family:inherit;transition:all .18s;display:flex;flex-direction:column;align-items:center;gap:2px;border-radius:10px}
.lvl-icon{font-size:17px;line-height:1}.lvl-name{font-size:10px;font-weight:700}
.lvl-desc{font-size:9px;font-weight:400;color:var(--text3);text-align:center;line-height:1.3}
.lvl-btn.ag{background:rgba(16,185,129,.08);border-color:#10b981;color:#059669}.lvl-btn.ag .lvl-desc{color:#34d399}
.lvl-btn.am{background:rgba(99,102,241,.08);border-color:#6366f1;color:#4f46e5}.lvl-btn.am .lvl-desc{color:#818cf8}
.lvl-btn.ae{background:rgba(245,158,11,.08);border-color:#f59e0b;color:#d97706}.lvl-btn.ae .lvl-desc{color:#fbbf24}
.hint-row{padding:5px 12px 2px;background:var(--bg3);flex-shrink:0}
.hint-box{border-radius:8px;padding:6px 10px;font-size:10.5px;font-weight:500;line-height:1.4}
.gh{background:rgba(16,185,129,.08);color:#34d399;border:.5px solid rgba(16,185,129,.2)}
.mh{background:rgba(99,102,241,.08);color:#818cf8;border:.5px solid rgba(99,102,241,.2)}
.eh{background:rgba(245,158,11,.08);color:#fbbf24;border:.5px solid rgba(245,158,11,.2)}
.tabs{display:flex;background:var(--bg3);flex-shrink:0;border-bottom:1px solid var(--border);margin-top:6px}
.tab{flex:1;padding:8px;font-size:11px;font-weight:600;cursor:pointer;border:none;background:transparent;color:var(--text3);font-family:inherit;border-bottom:2px solid transparent;transition:all .15s}
.tab.on{color:var(--ind);border-bottom-color:var(--ind);background:rgba(129,140,248,.05)}
.pane{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 10px 20px;background:var(--bg3)}
.pane.off{display:none}
.sdiv{display:flex;align-items:center;gap:8px;margin:14px 0 8px;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--text3)}
.sdiv::before,.sdiv::after{content:'';flex:1;height:.5px;background:var(--border)}
.sbadge{padding:2px 8px;border-radius:4px;font-size:9px;font-weight:700}
.card{background:var(--card);border-radius:12px;border:.5px solid var(--border);padding:11px 13px;margin-bottom:9px}
.ch{display:flex;align-items:center;gap:7px;margin-bottom:5px}
.ci{width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:13px}
.cl{font-size:12px;font-weight:600;color:var(--text)}
.tip{font-size:11px;color:var(--text3);margin-bottom:6px;padding:5px 8px;background:rgba(129,140,248,.07);border-left:2px solid var(--ind);border-radius:0 4px 4px 0;line-height:1.5}
.inp{width:100%;background:var(--bg2);border:.5px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--text);font-family:inherit;resize:none;-webkit-appearance:none}
.inp:focus{outline:none;border-color:var(--ind);box-shadow:0 0 0 3px rgba(129,140,248,.1)}
.inp::placeholder{color:var(--text3);font-size:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:3px}
.chip{padding:5px 11px;border-radius:20px;font-size:11px;cursor:pointer;border:.5px solid var(--border);background:var(--bg2);color:var(--text2);font-family:inherit;font-weight:500;transition:all .15s}
.chip.on{background:rgba(129,140,248,.15);border-color:var(--ind);color:var(--ind)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:50px 20px;gap:10px;opacity:.4;text-align:center}
.empty p{font-size:13px;color:var(--text2);line-height:1.6}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-bottom:10px}
.stat{background:var(--card);border-radius:7px;padding:7px 9px;border:.5px solid var(--border)}
.sv{font-size:17px;font-weight:700}.sl{font-size:10px;color:var(--text3);margin-top:1px}
.psec{margin-bottom:10px}
.plbl{display:inline-flex;font-size:9px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:2px 6px;border-radius:4px;margin-bottom:4px}
.c0{background:rgba(129,140,248,.12);color:#818cf8}.c1{background:rgba(16,185,129,.12);color:#059669}
.c2{background:rgba(245,158,11,.12);color:#d97706}.c3{background:rgba(236,72,153,.12);color:#db2777}
.c4{background:rgba(99,102,241,.12);color:#4f46e5}.c5{background:rgba(239,68,68,.12);color:#dc2626}
.c6{background:rgba(20,184,166,.12);color:#0f766e}.c7{background:rgba(139,92,246,.12);color:#7c3aed}
.c8{background:rgba(249,115,22,.12);color:#c2410c}.c9{background:rgba(14,165,233,.12);color:#0369a1}
.cz{background:rgba(100,116,139,.12);color:#475569}
.pbody{font-size:12px;color:var(--text);line-height:1.7;padding-left:2px}
.pstep{display:flex;gap:7px;margin-bottom:3px}
.sn{min-width:18px;height:18px;border-radius:50%;background:rgba(20,184,166,.12);color:#0f766e;font-size:9px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:2px}
.pdiv{border:none;border-top:.5px dashed var(--border);margin:8px 0}
.pclo{background:rgba(129,140,248,.06);border:.5px solid rgba(129,140,248,.2);border-radius:7px;padding:8px 10px;font-size:11px;color:var(--text2);line-height:1.6}
.acts{display:flex;gap:7px;margin-top:4px}
.btn{display:flex;align-items:center;justify-content:center;gap:5px;padding:11px 14px;border-radius:9px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:inherit;transition:all .15s}
.btnp{background:linear-gradient(135deg,#6366f1,#4f46e5);color:#fff;flex:1}
.btnp:active{opacity:.85;transform:scale(.98)}
.btng{background:var(--card);border:.5px solid var(--border);color:var(--text2);padding:11px;min-width:44px}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#10b981;color:#fff;padding:9px 18px;border-radius:9px;font-size:12px;font-weight:600;pointer-events:none;opacity:0;transition:opacity .2s;z-index:99;white-space:nowrap}
.toast.on{opacity:1}
.cur{display:inline-block;width:2px;height:12px;background:var(--ind);animation:blink 1s infinite;vertical-align:middle;border-radius:1px;margin-left:2px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}
</style>
</head>
<body>
<div class="hdr">
  <div class="logo"><svg viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div>
  <div><div class="brand">PromptFlow</div><div class="brand-sub">Simple Input · Expert Prompt</div></div>
  <div class="hdr-r"><div class="lsw">
    <select id="lsel" onchange="changeLang(this.value)">
      <option value="en">🇬🇧 EN</option><option value="th">🇹🇭 TH</option>
    </select>
  </div></div>
</div>
<div class="car-row">
  <div class="car-wrap"><select id="csel" onchange="setCar(this.value)"></select></div>
  <div id="cbadge"></div>
</div>
<div class="lvl-row">
  <button class="lvl-btn ag" id="bg" onclick="setLevel('g')">
    <span class="lvl-icon">🙋</span><span class="lvl-name" id="lg">General</span>
    <span class="lvl-desc" id="lgd">Everyday tasks</span>
  </button>
  <button class="lvl-btn" id="bm" onclick="setLevel('m')">
    <span class="lvl-icon">📊</span><span class="lvl-name" id="lm">Manager</span>
    <span class="lvl-desc" id="lmd">Team decisions</span>
  </button>
  <button class="lvl-btn" id="be" onclick="setLevel('e')">
    <span class="lvl-icon">🏆</span><span class="lvl-name" id="le">Executive</span>
    <span class="lvl-desc" id="led">Board strategy</span>
  </button>
</div>
<div class="hint-row"><div class="hint-box gh" id="hbox"></div></div>
<div class="tabs">
  <button class="tab on" id="ti" onclick="switchTab('i')">✏️ <span id="tli">Input</span></button>
  <button class="tab" id="tp" onclick="switchTab('p')">👁 <span id="tlp">Preview</span></button>
</div>
<div class="pane" id="pi"><div id="fc"></div></div>
<div class="pane off" id="pp">
  <div class="stats">
    <div class="stat"><div class="sv" id="sc">0</div><div class="sl" id="slc">Chars</div></div>
    <div class="stat"><div class="sv" id="st">0</div><div class="sl">~Tokens</div></div>
    <div class="stat"><div class="sv" id="ss">0</div><div class="sl" id="sls">Sections</div></div>
  </div>
  <div class="empty" id="pe"><p id="pet">Fill in fields to see your Prompt</p></div>
  <div id="pc" style="display:none"></div>
  <div style="height:8px"></div>
  <div class="acts">
    <button class="btn btng" onclick="clearAll()">🗑</button>
    <button class="btn btnp" id="cpbtn" onclick="copyPrompt()">📋 <span id="cpl">Copy Prompt</span></button>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
// ── CONSTANTS ──────────────────────────────────────────────────────────────
var CARS=['content','review','caption','lawyer','engineer','cfo','marketing','sales','hr','ta','teacher','influencer'];
var EMO={content:'✍️',review:'⭐',caption:'📸',lawyer:'⚖️',engineer:'🔧',cfo:'💰',marketing:'📣',sales:'🎯',hr:'👥',ta:'🔍',teacher:'🎓',influencer:'🌟'};
var COL={content:'#818cf8',review:'#f59e0b',caption:'#ec4899',lawyer:'#94a3b8',engineer:'#38bdf8',cfo:'#10b981',marketing:'#f97316',sales:'#ef4444',hr:'#8b5cf6',ta:'#06b6d4',teacher:'#f59e0b',influencer:'#a855f7'};
var BGC={content:'rgba(129,140,248,.12)',review:'rgba(245,158,11,.12)',caption:'rgba(236,72,153,.12)',lawyer:'rgba(148,163,184,.12)',engineer:'rgba(56,189,248,.12)',cfo:'rgba(16,185,129,.12)',marketing:'rgba(249,115,22,.12)',sales:'rgba(239,68,68,.12)',hr:'rgba(139,92,246,.12)',ta:'rgba(6,182,212,.12)',teacher:'rgba(245,158,11,.12)',influencer:'rgba(168,85,247,.12)'};
var BCLS=['c0','c1','c2','c3','c4','c5','c6','c7','c8','c9','c0'];
var APP={lang:'en',level:'g',car:'content',fields:{},tab:'i'};

// ── UI STRINGS ─────────────────────────────────────────────────────────────
var UI={
  en:{inp:'Input',prev:'Preview',chars:'Chars',secs:'Sections',copy:'Copy Prompt',copied:'Copied!',fill:'Fill in fields to see your Prompt',fin:'Final Instruction',
      lG:'General',lM:'Manager',lE:'Executive',lgd:'Everyday tasks',lmd:'Team decisions',led:'Board strategy',
      hG:'🙋 General — everyday tasks, quick answers, clear summaries',
      hM:'📊 Manager — data-driven decisions, team reports, structured planning',
      hE:'🏆 Executive — board-level strategy, investment decisions, governance'},
  th:{inp:'กรอกข้อมูล',prev:'ดูตัวอย่าง',chars:'ตัวอักษร',secs:'ส่วน',copy:'Copy Prompt',copied:'คัดลอกแล้ว!',fill:'กรอกข้อมูลเพื่อดู Prompt',fin:'คำสั่งสุดท้าย',
      lG:'ทั่วไป',lM:'ผู้จัดการ',lE:'ผู้บริหาร',lgd:'งานประจำวัน',lmd:'ตัดสินใจทีม',led:'กลยุทธ์บอร์ด',
      hG:'🙋 ทั่วไป — งานประจำวัน คำตอบรวดเร็ว สรุปข้อมูล',
      hM:'📊 ผู้จัดการ — ตัดสินใจด้วยข้อมูล รายงานทีม วางแผน',
      hE:'🏆 ผู้บริหาร — กลยุทธ์บอร์ด การลงทุน Governance'}
};

// ── CAREER META (both languages) ───────────────────────────────────────────
var CMETA={
  en:{
    content:{n:'Content Creator',d:'Blog, article & storytelling'},
    review:{n:'Goods Review',d:'Product & service reviews'},
    caption:{n:'Caption / Post',d:'Social media captions'},
    lawyer:{n:'Lawyer',d:'Legal analysis & drafting'},
    engineer:{n:'Engineer',d:'Technical problem-solving'},
    cfo:{n:'CFO',d:'Financial strategy & analysis'},
    marketing:{n:'Digital Marketing',d:'Campaigns, ads & growth'},
    sales:{n:'Sales Director',d:'Sales strategy & closing'},
    hr:{n:'Human Resource',d:'HR policies & people ops'},
    ta:{n:'Talent Acquisition',d:'Recruiting & hiring'},
    teacher:{n:'Teacher',d:'Lesson plans & teaching aids'},
    influencer:{n:'Influencer',d:'Personal brand & content'}
  },
  th:{
    content:{n:'นักสร้างคอนเทนต์',d:'บล็อก บทความ เล่าเรื่อง'},
    review:{n:'รีวิวสินค้า',d:'รีวิวสินค้าและบริการ'},
    caption:{n:'แคปชั่นโพสต์',d:'แคปชั่นโซเชียลมีเดีย'},
    lawyer:{n:'ทนายความ',d:'วิเคราะห์กฎหมายและร่างเอกสาร'},
    engineer:{n:'วิศวกร',d:'แก้ปัญหาเทคนิค'},
    cfo:{n:'CFO / ผู้บริหารการเงิน',d:'กลยุทธ์การเงิน'},
    marketing:{n:'ดิจิทัลมาร์เก็ตติ้ง',d:'แคมเปญโฆษณา'},
    sales:{n:'ผู้อำนวยการฝ่ายขาย',d:'กลยุทธ์การขาย'},
    hr:{n:'ทรัพยากรบุคคล',d:'นโยบาย HR และวัฒนธรรม'},
    ta:{n:'Talent Acquisition',d:'รับสมัครและจ้างงาน'},
    teacher:{n:'ครู / อาจารย์',d:'แผนการสอนและสื่อการเรียน'},
    influencer:{n:'อินฟลูเอนเซอร์',d:'แบรนด์ส่วนตัวและคอนเทนต์'}
  }
};

// ── FIELD DATA — stored per language ──────────────────────────────────────
// Structure: FD[lang][career][level] = [{s:'section name', fields:[{id,l,tip,ph,opts,rows}]}]
var FD={en:{},th:{}};

// ════════════════════════════════════════════════════════════════
// ENGLISH FIELDS
// ════════════════════════════════════════════════════════════════
FD.en.content={
  g:[
    {s:'📝 What to Write',fields:[
      {id:'topic',l:'What do you want to write about?',tip:'Say the main idea in plain words.',ph:'e.g. "5 tips for better sleep" or "How I save money every month"'},
      {id:'audience',l:'Who will read this?',tip:'Picture one real person — age, job, problem they have.',ph:'e.g. "Working moms who want quick healthy meal ideas"'},
      {id:'format',l:'Content style',opts:['Blog Post / Story','Step-by-step List','Q&A','Opinion Piece','Newsletter','Social Thread']},
      {id:'tone',l:'How should it sound?',opts:['Friendly & Casual','Inspiring','Clear & Informative','Funny','Professional','Storytelling']},
      {id:'length',l:'How long?',opts:['Under 300 words','300-600 words','600-1000 words','1000-2000 words']}
    ]},
    {s:'⚙️ Extra Details',fields:[
      {id:'cta',l:'What should the reader do next?',tip:'Follow? Buy? Share?',ph:'e.g. "Follow my page" or "Download the free guide"'},
      {id:'avoid',l:'What to avoid',ph:'e.g. "No jargon, no politics"'}
    ]}
  ],
  m:[
    {s:'📝 Content Brief',fields:[
      {id:'topic',l:'Content topic and working title',tip:'Be specific — this guides the whole piece.',ph:'e.g. "2025 Guide: How Remote Teams Stay Productive Without Micromanagement"'},
      {id:'objective',l:'Business objective of this content',tip:'Why is the company publishing this?',ph:'e.g. "Generate leads for our HR software targeting HR Managers"'},
      {id:'audience',l:'Target audience persona',ph:'e.g. "HR Managers at 50-200 person companies frustrated with low team visibility"'},
      {id:'format',l:'Desired format',opts:['Long-form guide','Listicle (numbered tips)','Case study','Thought leadership','Email series','Pillar page']},
      {id:'tone',l:'Brand voice and tone',opts:['Authoritative & expert','Warm & approachable','Bold & challenger','Data-driven','Conversational']}
    ]},
    {s:'📊 Strategy and Output',fields:[
      {id:'keywords',l:'Target SEO keywords',ph:'e.g. "remote team productivity (primary), WFH management tools (secondary)"'},
      {id:'funnel',l:'Funnel stage',opts:['Awareness (problem unaware)','Consideration (exploring options)','Decision (ready to buy)','Retention (existing customers)']},
      {id:'cta',l:'Desired conversion action',ph:'e.g. "Book a free demo" or "Download the Remote Work Playbook"'},
      {id:'kpi',l:'How will this be measured?',ph:'e.g. "500 organic visits/month in 6 months, 50 demo requests"'},
      {id:'avoid',l:'Brand and legal constraints',ph:'e.g. "Do not mention competitor names. Avoid ROI claims without data."'}
    ]}
  ],
  e:[
    {s:'🎯 Strategic Content Brief',fields:[
      {id:'topic',l:'Content initiative and strategic theme',ph:'e.g. "Executive Perspective: The Hidden Cost of Poor Employee Wellbeing"'},
      {id:'business_goal',l:'Business outcome this content supports',ph:'e.g. "Support Series B fundraising by positioning CEO as future-of-work authority"'},
      {id:'audience',l:'Primary and secondary audience',ph:'e.g. "Primary: CHRO/CEO at enterprise. Secondary: investors, board, press"'}
    ]},
    {s:'📣 Positioning and Narrative',fields:[
      {id:'positioning',l:'Thought leadership angle',ph:'e.g. "Companies investing in wellbeing outperform peers by 21% — our proprietary research"'},
      {id:'narrative',l:'Core narrative arc',ph:'e.g. "Opens: most execs think wellbeing is HRs problem. Closes: it is the #1 CFO risk."'},
      {id:'evidence',l:'Data and proof points to include',ph:'e.g. "Our 2025 Workforce Report: 68% of Fortune 500 CHROs cite burnout as top retention risk"'}
    ]},
    {s:'📊 Amplification and KPIs',fields:[
      {id:'distribution',l:'Distribution plan',opts:['Press release + media outreach','CEO LinkedIn + paid amplification','Investor relations chapter','Conference keynote material','Integrated campaign']},
      {id:'kpi',l:'Executive-level success metrics',ph:'e.g. "3 tier-1 media pickups, 10K LinkedIn impressions, cited in 2 investor conversations"'},
      {id:'tone',l:'Voice and positioning',opts:['Visionary & bold','Data-driven & analytical','Empathetic & human-first','Challenger & provocative']}
    ]}
  ]
};

FD.en.review={
  g:[
    {s:'🛍 Product Info',fields:[
      {id:'product',l:'Product or service name',tip:'Full name including brand.',ph:'e.g. "Dyson V15 Vacuum Cleaner"'},
      {id:'category',l:'Type of product',opts:['Electronics','Skincare & Beauty','Food & Drink','Fashion','Home & Kitchen','Health & Fitness','App or Software','Service']},
      {id:'price',l:'How much did it cost?',ph:'e.g. "$49" or "1,500 baht"'},
      {id:'usage',l:'How long have you used it?',ph:'e.g. "Every day for 2 months"'}

    hr:{g:'สร้าง HR Output ที่ขอ สมดุลระหว่างความยุติธรรมต่อพนักงานและการปกป้องบริษัท รวมคำพูดเฉพาะสำหรับเอกสารหรือการสนทนา ระบุความเสี่ยงทางกฎหมาย',m:'ส่ง People Management Document รวม: Situation Assessment, Recommended Approach พร้อมเหตุผล, Action Plan ทีละขั้น, Communication Scripts/Templates, Legal Risk Flags, Success Metrics พร้อม HRBP/Line Manager Execute ได้เลย',e:'ผลิต Board-level People Strategy Document รวม: Workforce Health Assessment, Strategic Gap Analysis, Investment Options พร้อม ROI Modelling, Risk Register, Recommended Resolutions, Implementation Roadmap ส่ง Investor-facing People Narrative ตามความเหมาะสม'},

// ── APP STATE ──────────────────────────────────────────────────────────────
var APP={lang:'en',level:'g',car:'content',fields:{},tab:'i'};

function u(id){return document.getElementById(id);}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function ui(){return UI[APP.lang];}
function cm(){return CMETA[APP.lang][APP.car];}

function applyUI(){
  var d=ui();
  u('tli').textContent=d.inp; u('tlp').textContent=d.prev;
  u('slc').textContent=d.chars; u('sls').textContent=d.secs;
  u('cpl').textContent=d.copy; u('pet').textContent=d.fill;
  u('lg').textContent=d.lG; u('lm').textContent=d.lM; u('le').textContent=d.lE;
  u('lgd').textContent=d.lgd; u('lmd').textContent=d.lmd; u('led').textContent=d.led;
  updateHint();
}

function updateHint(){
  var d=ui(), hmap={g:d.hG,m:d.hM,e:d.hE}, cmap={g:'gh',m:'mh',e:'eh'};
  var box=u('hbox'); box.textContent=hmap[APP.level]; box.className='hint-box '+cmap[APP.level];
}

function rebuildCar(){
  var meta=CMETA[APP.lang];
  u('csel').innerHTML=CARS.map(function(k){
    return '<option value="'+k+'"'+(APP.car===k?' selected':'')+'>'+EMO[k]+' '+meta[k].n+'</option>';
  }).join('');
}

function renderBadge(){
  var m=cm();
  u('cbadge').innerHTML='<span class="badge" style="background:'+BGC[APP.car]+';color:'+COL[APP.car]+'">'+EMO[APP.car]+' '+m.n+' — '+m.d+'</span>';
}

function getSecs(){
  var fd=FD[APP.lang][APP.car];
  if(!fd) return [];
  return fd[APP.level]||[];
}

function renderFields(){
  var secs=getSecs(), fc=u('fc');
  fc.innerHTML=''; APP.fields={};
  secs.forEach(function(sec){
    var div=document.createElement('div');
    div.className='sdiv';
    div.innerHTML='<span class="sbadge" style="background:'+BGC[APP.car]+';color:'+COL[APP.car]+'">'+sec.s+'</span>';
    fc.appendChild(div);
    sec.fields.forEach(function(f){
      APP.fields[f.id]='';
      var card=document.createElement('div');
      card.className='card';
      var tip=f.tip?'<div class="tip">💡 '+f.tip+'</div>':'';
      var inp='';
      if(f.opts){
        inp='<div class="chips" id="ch_'+f.id+'">'+f.opts.map(function(o){return '<button class="chip" onclick="tog(this,\''+f.id+'\')">'+o+'</button>';}).join('')+'</div>';
      }else if(f.rows){
        inp='<textarea id="fi_'+f.id+'" class="inp" rows="'+f.rows+'" placeholder="'+(f.ph||'').replace(/"/g,'&quot;')+'"></textarea>';
      }else{
        inp='<input id="fi_'+f.id+'" class="inp" type="text" placeholder="'+(f.ph||'').replace(/"/g,'&quot;')+'" autocomplete="off">';
      }
      card.innerHTML='<div class="ch"><div class="ci" style="background:'+BGC[APP.car]+'">'+EMO[APP.car]+'</div><span class="cl">'+f.l+'</span></div>'+tip+inp;
      fc.appendChild(card);
      if(!f.opts){
        (function(fid){
          var el=document.getElementById('fi_'+fid);
          if(el) el.addEventListener('input',function(){APP.fields[fid]=el.value;upPrev();});
        })(f.id);
      }
    });
  });
}

function tog(el,id){
  var chips=document.querySelectorAll('#ch_'+id+' .chip');
  for(var i=0;i<chips.length;i++) chips[i].classList.remove('on');
  APP.fields[id]=(APP.fields[id]===el.textContent)?'':el.textContent;
  if(APP.fields[id]) el.classList.add('on');
  upPrev();
}

function buildBlocks(){
  var secs=getSecs(),B=[];
  secs.forEach(function(sec){
    sec.fields.forEach(function(f){
      var v=(APP.fields[f.id]||'').trim(); if(!v) return;
      var lines=v.split('\n').filter(function(l){return l.trim();});
      if(lines.length>1) B.push({lbl:f.l,steps:lines});
      else B.push({lbl:f.l,body:esc(v)});
    });
  });
  return B;
}

function lvlLabel(){
  var d=ui(); return {g:d.lG,m:d.lM,e:d.lE}[APP.level];
}

function upPrev(){
  var B=buildBlocks(),pe=u('pe'),pc=u('pc');
  if(!B.length){
    pe.style.display='flex'; pc.style.display='none';
    ['sc','st','ss'].forEach(function(id){u(id).textContent='0';});
    return;
  }
  pe.style.display='none'; pc.style.display='block';
  var closing=CL[APP.lang][APP.car][APP.level], fl=ui().fin;
  pc.innerHTML=B.map(function(b,i){
    var cls=BCLS[i%BCLS.length];
    var body=b.steps
      ?b.steps.map(function(s,j){return '<div class="pstep"><span class="sn">'+(j+1)+'</span><span>'+esc(s)+'</span></div>';}).join('')
      :'<div class="pbody">'+b.body+'</div>';
    return '<div class="psec"><div class="plbl '+cls+'">'+b.lbl+'</div>'+body+'</div>';
  }).join('')+'<hr class="pdiv"><div class="pclo"><span class="plbl cz" style="display:inline-flex;margin-bottom:4px">'+fl+'</span><br>'+closing+'</div><span class="cur"></span>';
  var plain=buildPlain(B,closing);
  u('sc').textContent=plain.length;
  u('st').textContent=Math.ceil(plain.length/3.5);
  u('ss').textContent=B.length;
}

function buildPlain(B,closing){
  var m=cm();
  var lines=[EMO[APP.car]+' '+m.n+' ['+lvlLabel()+']',''];
  B.forEach(function(b){
    if(b.steps){lines.push('['+b.lbl+']');b.steps.forEach(function(s,i){lines.push('  '+(i+1)+'. '+s);});}
    else lines.push('['+b.lbl+'] '+b.body.replace(/<[^>]+>/g,''));
  });
  lines.push('',closing);
  return lines.join('\n');
}

function setLevel(lv){
  APP.level=lv;
  var lvls=['g','m','e'],cls=['ag','am','ae'],ids=['bg','bm','be'];
  for(var i=0;i<lvls.length;i++){
    u(ids[i]).className='lvl-btn'+(lvls[i]===lv?' '+cls[i]:'');
  }
  updateHint(); renderFields(); upPrev();
}

function setCar(k){APP.car=k; APP.fields={}; renderBadge(); renderFields(); upPrev();}

function changeLang(lv){
  APP.lang=lv;
  applyUI();
  rebuildCar();
  renderBadge();
  renderFields();
  upPrev();
}

function switchTab(t){
  APP.tab=t;
  u('pi').className='pane'+(t==='i'?'':' off');
  u('pp').className='pane'+(t==='p'?'':' off');
  u('ti').className='tab'+(t==='i'?' on':'');
  u('tp').className='tab'+(t==='p'?' on':'');
  if(t==='p') upPrev();
}

function copyPrompt(){
  var B=buildBlocks();
  if(!B.length){toast(ui().fill);return;}
  var txt=buildPlain(B,CL[APP.lang][APP.car][APP.level]);
  navigator.clipboard.writeText(txt).then(function(){
    toast(ui().copied);
    var l=u('cpl'),b=u('cpbtn');
    l.textContent=ui().copied; b.style.background='linear-gradient(135deg,#10b981,#059669)';
    setTimeout(function(){l.textContent=ui().copy; b.style.background='';},2000);
  }).catch(function(){
    var a=document.createElement('textarea'); a.value=txt;
    document.body.appendChild(a); a.select(); document.execCommand('copy'); document.body.removeChild(a);
    toast(ui().copied);
  });
}

function clearAll(){APP.fields={}; renderFields(); upPrev();}

function toast(msg){
  var t=u('toast'); t.textContent=msg; t.classList.add('on');
  setTimeout(function(){t.classList.remove('on');},2000);
}

// ── INIT ───────────────────────────────────────────────────────────────────
applyUI(); setLevel('g'); rebuildCar(); renderBadge(); renderFields();
</script>
</body>
